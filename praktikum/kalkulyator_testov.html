<!DOCTYPE html>

<title>Калькулятор тестов практикума — Анализ целесообразности предпринимательской деятельности</title>
<style>
:root{--blue:#1a73e8;--blue-bg:#e8f0fe;--green:#188038;--green-bg:#e6f4ea;--red:#d93025;--amber:#e37400;--bg:#f6f8fb;--card:#fff;--text:#202124;--muted:#5f6368;--border:#dadce0}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.45}
#layout{display:flex;min-height:100vh}
#sidebar{width:300px;background:#fff;border-right:1px solid var(--border);padding:14px 10px 30px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
#sidebar h1{font-size:16px;margin:6px 8px 2px;color:var(--blue)}
#sidebar .sub{font-size:11.5px;color:var(--muted);margin:0 8px 12px}
.navpart{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:14px 8px 4px;font-weight:600}
.navitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:20px;cursor:pointer;font-size:13.5px;margin:2px 0;border:none;background:transparent;width:100%;text-align:left;color:var(--text)}
.navitem:hover{background:#f1f3f4}
.navitem.active{background:var(--blue-bg);color:var(--blue);font-weight:600}
.navitem .st{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}
.navitem .st.done{color:var(--green);font-weight:700}
#main{flex:1;padding:24px 30px 80px;max-width:980px;margin:0 auto;min-width:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:16px}
.card h2{margin:0 0 6px;font-size:20px;color:var(--blue)}
.partlabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.intro{background:#fef7e0;border:1px solid #fde293;border-radius:10px;padding:12px 16px;font-size:13.5px;margin:10px 0 16px}
.intro p{margin:6px 0}
.note{font-size:12.5px;color:var(--muted);margin:8px 0}
.formlink{font-size:12.5px}
.formlink a{color:var(--blue);text-decoration:none}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.qcard.answered{border-left:5px solid var(--green)}
.qtitle{font-weight:600;font-size:15px;margin-bottom:2px;white-space:pre-line}
.qnote{font-size:12px;color:var(--muted);margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:14px}
.opt:hover{background:#f8f9fa}
.opt input{margin-top:3px;accent-color:var(--blue);flex-shrink:0}
.opt .pts{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap;padding-top:2px}
#resultbar{position:sticky;top:12px;z-index:50;background:#fff;border:2px solid var(--blue);border-radius:12px;padding:14px 20px;margin-bottom:18px;box-shadow:0 2px 10px rgba(26,115,232,.18)}
#resultbar .big{font-size:22px;font-weight:700;color:var(--blue)}
#resultbar .prog{font-size:13px;color:var(--muted)}
.bar{height:6px;background:#e8eaed;border-radius:3px;margin:8px 0;overflow:hidden}
.bar>div{height:100%;background:var(--green);width:0;transition:width .25s}
.band{border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:13.5px;background:#fafafa}
.band.active{border-color:var(--green);background:var(--green-bg);box-shadow:0 0 0 1px var(--green)}
.band .bt{font-weight:700}
.verdict{font-size:15px;font-weight:700;margin:10px 0}
.verdict.good{color:var(--green)}.verdict.bad{color:var(--red)}.verdict.mid{color:var(--amber)}
button.btn{background:var(--blue);color:#fff;border:none;border-radius:6px;padding:9px 18px;font-size:14px;cursor:pointer;margin:4px 6px 4px 0}
button.btn:hover{filter:brightness(1.1)}
button.btn.gray{background:#f1f3f4;color:var(--text);border:1px solid var(--border)}
input.txt{border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:14px;width:100%;max-width:420px;margin:4px 0}
table.rep{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0}
table.rep th,table.rep td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
table.rep th{background:var(--blue-bg)}
.assum{background:#fce8e6;border:1px solid #f5c6c0;border-radius:10px;padding:12px 16px;font-size:12.5px;margin:12px 0}
.assum b{color:var(--red)}
.hidden{display:none}
#menuToggle{display:none}
@media (max-width:860px){
 #sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.2)}
 body.navopen #sidebar{transform:none}
 #menuToggle{display:block;position:fixed;top:10px;left:10px;z-index:101;background:var(--blue);color:#fff;border:none;border-radius:8px;padding:10px 14px;font-size:16px;cursor:pointer}
 #main{padding:60px 14px 60px}
}
@media print{
 #sidebar,#menuToggle,button.btn,.noprint{display:none!important}
 body,#layout,#main{display:block;background:#fff;padding:0;max-width:none}
 #resultbar{position:static;box-shadow:none}
 .card,.qcard{break-inside:avoid;border-color:#999}
}
</style>
</head>

{id:"t23",nav:"Тест 2.3. Умение влиять",part:"Часть 2. Анализ возможностей руководящей деятельности",

  b.push(band(35,65,"35-65 баллов. Вы человек, который обладает великолепными предпосылками, чтобы эффективно влиять на других, менять их модели поведения, учить, управлять, наставлять на путь истинный. В подобного рода ситуациях Вы обычно чувствуете себя, «как рыба в воде». Вы убеждены, что человек не должен замыкаться в себе, избегать людей, держаться на обочине и думать только о себе. Он должен делать что-то для других, руководить ими, указывать им на допущенные ошибки, учить их, чтобы они лучше чувствовали себя в окружающей действительности. Тех же, кому не нравятся такие отношения, по Вашему мнению, не следует щадить. Вы наделены даром убеждать окружающих в своей правоте. Однако Вам надо быть очень осторожным, чтобы Ваша позиция не стала чрезмерно агрессивной.",v>=35));

  var gap=(v>30&&v<35)?'<div class="note">Диапазон 31–34 балла в тексте вывода формы не описан; действует общее правило ниже.</div>':"";
  return b.join("")+gap+'<div class="band">Чем больше баллов, тем более ярко проявляются ваши качества, описанные выше.</div><div class="assum"><b>Ключ в форме не приведён.</b> Каждая сетка формы помечена «5 баллов»; подсчёт: «да» = 5 баллов, «нет» = 0 (максимум 13 × 5 = 65, что соответствует верхней границе «35-65 баллов» из вывода формы).</div>';},

{id:"t24",nav:"Тест 2.4. Данные для успеха",part:"Часть 2. Анализ возможностей руководящей деятельности",
 title:"ЧАСТЬ 2 Тест 2.4 Оценка данных, способствующих успеху",
 intro:"Успех, в первую очередь, сопутствует тем, кто обладает определенными чертами характера (данными от рождения или выработанными самостоятельно).\n\nОсновой для достижения успеха являются следующие качества.\n\n• Упорное утверждение своей личности. Эта психологическая особенность обычно проявляется очень рано, но совсем не обязательно, что она влияет на высокие оценки за учебу. Скорее она выражается в стремлении не подлаживаться под окружающих и идти к собственной цели, не пасуя перед преградами.\n\n• Способность контактировать с окружающими. Основа этой способности - умение понять психологические особенности сотрудников (соперников) и правильно использовать эту козырную карту в большой игре жизни.\n\n• Физическая выносливость. Психологическая гармония обеспечивает завидное здоровье, которое также является важным элементом успеха.\n\n• Способность точно предвидеть, как будут развиваться события.\n\n• Особая «гибкость». Человек, рожденный для удачи, всегда точно понимает, когда надо признавать свое поражение или пойти на разумный компромисс. Он умеет при необходимости быть и очень упорным, но не делает личной трагедии из неудачи, поскольку уверен в своем конечном успехе.\n\n• Способность убеждать других.\n\nОцените, насколько каждое из этих качеств соответствует Вашему характеру: выберите наиболее подходящий вариант ответа.",
 q:T24_Q,
 metric:"Сумма",unit:"баллов (60–200)",tr:function(s){return s;},
 interpret:function(v){var b=[];
  b.push(band(140,200,"140 - 200 баллов. У Вас есть возможности добиться успеха в жизни. В Вашем характере существует хорошее равновесие между и разумом, между личной и общественной жизнью, между действием и размышлением.",v>=140));
  b.push(band(70,139,"70 - 139 баллов. Вы в принципе обладаете качествами, необходимыми для того, чтобы утвердиться в обществе. Но все же Вам необходимо постоянно контролировать себя и не допускать, чтобы тлеющие в Вашем подсознании конфликтные ситуации «вырывались» на поверхность и влияли на Ваши действия.",v>=70&&v<140));
  b.push(band(60,69,"60 - 69 баллов. Вам необходима большая вера в себя и большая открытость перед окружающими. Только так Вы сможете добиться полной реализации своих способностей.",v>=60&&v<70));
  return b.join("")+'<div class="assum"><b>Ключ в форме не приведён.</b> Каждый вопрос формы помечен «18 points» (18 = сумма баллов трёх вариантов), а диапазоны вывода дают максимум 200 (20 × 10) и минимум 60 (20 × 3). Отсюда ключ: первый вариант = 10 баллов, второй = 5, третий = 3.</div>';},
 formula:""},

function band(min,max,txt,active){return '<div class="band'+(active?" active":"")+'"><span class="bt">'+txt+"</span></div>";}

/* ============ СОСТОЯНИЕ ============ */
var LS="praktikum_calc_v1";
var state={answers:{},fio:"",group:"",integral:{ufr:"",unr:"",uz:""}};
try{var saved=JSON.parse(localStorage.getItem(LS));if(saved&&saved.answers)state=saved;}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function getMetric(id){
 var t=TESTS.filter(function(x){return x.id===id;})[0];if(!t)return null;
 var a=state.answers[id];if(!a)return null;
 var sum=0;
 for(var i=0;i<t.q.length;i++){if(a[i]===undefined||a[i]===null)return null;sum+=t.q[i].o[a[i]][1];}
 return t.tr(sum);
}
function getSum(id){
 var t=TESTS.filter(function(x){return x.id===id;})[0];if(!t)return null;
 var a=state.answers[id];if(!a)return null;var sum=0;
 for(var i=0;i<t.q.length;i++){if(a[i]===undefined||a[i]===null)return null;sum+=t.q[i].o[a[i]][1];}
 return sum;
}
function answeredCount(id){var t=TESTS.filter(function(x){return x.id===id;})[0];var a=state.answers[id]||{};var n=0;for(var i=0;i<t.q.length;i++){if(a[i]!==undefined&&a[i]!==null)n++;}return n;}

/* ============ НАВИГАЦИЯ ============ */
var views=["integral","report"];
function navStatus(id){
 if(id==="integral"){var m=[getMetric("t31"),getMetric("t32"),getMetric("t33")];var ok=m[0]!==null&&m[1]!==null&&m[2]!==null;return ok?'<span class="st done">✓</span>':'<span class="st">3.1–3.3</span>';}
 if(id==="report"){return '<span class="st">печать</span>';}
 var t=TESTS.filter(function(x){return x.id===id;})[0];
 var n=answeredCount(id);var full=n===t.q.length;
 return full?'<span class="st done">✓ '+n+"/"+t.q.length+"</span>":'<span class="st">'+n+"/"+t.q.length+"</span>";
}
function renderNav(current){
 var h="";var lastPart="";
 TESTS.forEach(function(t){
  if(t.part!==lastPart){h+='<div class="navpart">'+t.part+"</div>";lastPart=t.part;}
  h+='<button class="navitem'+(current===t.id?" active":"")+'" onclick="go(\''+t.id+'\')">'+t.nav+navStatus(t.id)+"</button>";});
 h+='<div class="navpart">Итоги</div>';

 h+='<button class="navitem'+(current==="report"?" active":"")+'" onclick="go(\'report\')">📄 Сводный отчёт'+navStatus("report")+"</button>";
 document.getElementById("nav").innerHTML=h;
}
var currentView="t1";
function go(id){currentView=id;render();document.body.classList.remove("navopen");window.scrollTo(0,0);}

/* ============ РЕНДЕР ============ */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function render(){
 renderNav(currentView);
 var m=document.getElementById("main");
 if(currentView==="integral"){m.innerHTML=renderIntegral();bindIntegral();return;}
 if(currentView==="report"){m.innerHTML=renderReport();bindReport();return;}
 var t=TESTS.filter(function(x){return x.id===currentView;})[0];
 var a=state.answers[t.id]||{};
 var h="";
 h+='<div class="partlabel">'+esc(t.part)+'</div>';
 h+='<div class="card"><h2>'+esc(t.title)+'</h2>';
 h+='<div class="formlink">Оригинал формы: <a href="'+FORMS[t.id]+'" target="_blank" rel="noopener">'+FORMS[t.id].replace("https://docs.google.com/forms/d/e/","…").replace("/viewform","")+"</a></div>";
 if(t.intro){h+='<div class="intro">'+t.intro.split("\n").filter(function(x){return x.trim()!=="";}).map(function(p){return "<p>"+esc(p)+"</p>";}).join("")+"</div>";}
 h+="</div>";

 t.q.forEach(function(q,i){
  var ans=a[i];
  h+='<div class="qcard'+(ans!==undefined&&ans!==null?" answered":"")+'" id="qc'+i+'">';
  h+='<div class="qtitle">'+esc(q.t)+"</div>";
  if(q.note)h+='<div class="qnote">'+esc(q.note)+"</div>";
  q.o.forEach(function(o,j){
   h+='<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'"'+(ans===j?" checked":"")+' onchange="setAns(\''+t.id+"\","+i+","+j+')"><span>'+esc(o[0])+'</span><span class="pts">'+o[1]+" б.</span></label>";});
  h+="</div>";});
 h+='<div class="noprint"><button class="btn gray" onclick="clearTest(\''+t.id+'\')">Очистить ответы этого теста</button></div>';
 m.innerHTML=h;

}
function setAns(id,qi,oi){
 if(!state.answers[id])state.answers[id]={};
 state.answers[id][qi]=oi;save();
 var t=TESTS.filter(function(x){return x.id===id;})[0];
 var qc=document.getElementById("qc"+qi);if(qc)qc.classList.add("answered");
 updateResultBar(t);renderNav(id);
}
function updateResultBar(t){
 var rb=document.getElementById("resultbar");if(!rb)return;
 var n=answeredCount(t.id);var total=t.q.length;var sum=getSum(t.id);
 var pct=Math.round(n/total*100);
 var h='<div class="prog">Отвечено '+n+" из "+total+'</div><div class="bar"><div style="width:'+pct+'%"></div></div>';
 if(n>0&&sum!==null){h+='<div class="prog">Текущая сумма баллов: <b>'+sum+"</b></div>";}
 if(sum!==null){
  var v=t.tr(sum);
  h+='<div class="big">'+esc(t.metric)+" = "+v+" "+esc(t.unit)+"</div>";
  if(t.formula)h+='<div class="note">'+esc(t.formula)+"</div>";
  h+=t.interpret(v);
 }else if(n===0){h+='<div class="big" style="font-size:15px;color:var(--muted)">Отвечайте на вопросы — результат считается автоматически</div>';}
 rb.innerHTML=h;
}
function clearTest(id){if(confirm("Очистить все ответы этого теста?")){delete state.answers[id];save();render();}}

/* ============ ИНТЕГРАЛЬНАЯ ОЦЕНКА ============ */
function renderIntegral(){
 var ufr=getMetric("t31");
 var unrV=null,t32sum=getSum("t32");if(t32sum!==null)unrV=t32sum<=5?2:(t32sum>=25?0:1);
 var uzV=null,t33sum=getSum("t33");if(t33sum!==null)uzV=t33sum>=9?2:(t33sum>=6?1:0);
 var it=state.integral;
 var vals=[it.ufr!==""?parseFloat(it.ufr):ufr,it.unr!==""?parseFloat(it.unr):unrV,it.uz!==""?parseFloat(it.uz):uzV];
 var h="";
 h+='<div class="partlabel">Часть 3. Анализ предпринимательского потенциала</div>';
 h+='<div class="card"><h2>ИНТЕГРАЛЬНАЯ ОЦЕНКА ПРЕДПРИНИМАТЕЛЬСКОГО ПОТЕНЦИАЛА</h2>';
 h+='<div class="intro"><p>Интегральное значение работоспособности Ур рассчитывается по формуле:</p><p style="font-size:18px;text-align:center"><b>Ур = (Уфр + Унр + Уз) / 6 × 100%</b></p><p>где Уфр — уровень физической работоспособности (тест 3.1), Унр — уровень нервно-эмоциональной работоспособности (тест 3.2), Уз — уровень здоровья (тест 3.3). Каждое значение: 0, 1 или 2 балла.</p></div>';

function fillIntegral(){
 var ufr=getMetric("t31");
 var t32sum=getSum("t32");var unrV=t32sum===null?"":(t32sum<=5?2:(t32sum>=25?0:1));
 var t33sum=getSum("t33");var uzV=t33sum===null?"":(t33sum>=9?2:(t33sum>=6?1:0));
 state.integral={ufr:ufr===null?"":String(ufr),unr:unrV===""?"":String(unrV),uz:uzV===""?"":String(uzV)};save();render();
}
function calcIntegral(){
 var f=function(id){var e=document.getElementById(id);return e?e.value:"";};
 var a=f("iufr"),b=f("iunr"),c=f("iuz");
 state.integral={ufr:a,unr:b,uz:c};save();
 var el=document.getElementById("integralResult");if(!el)return;
 if(a===""||b===""||c===""){el.innerHTML='<div class="note">Заполните все три значения (или пройдите тесты 3.1–3.3 и нажмите «Подставить»).</div>';return;}
 var A=parseFloat(a),B=parseFloat(b),C=parseFloat(c);
 if(isNaN(A)||isNaN(B)||isNaN(C)){el.innerHTML='<div class="note">Введите числа.</div>';return;}
 var ur=(A+B+C)/6*100;
 var urr=Math.round(ur*10)/10;
 var verdict;
 if(A===0||B===0||C===0){verdict='<div class="verdict bad">Одно из частных значений равно 0 → предпринимательская деятельность противопоказана (правило 1).</div>';}
 else if(ur===100){verdict='<div class="verdict good">Ур = 100% → предпринимательская деятельность возможна без всяких ограничений (правило 3).</div>';}
 else if(ur>=50){verdict='<div class="verdict mid">Ур ≥ 50% → предпринимательская деятельность допустима при условии учета всех факторов, определяющих состояние здоровья, т. е. с ограничениями (правило 2).</div>';}
 else{verdict='<div class="verdict bad">Ур &lt; 50% (в форме этот случай отдельно не описан; ближайшая трактовка — деятельность не рекомендуется).</div>';}
 el.innerHTML='<div class="big" style="font-size:24px;color:var(--blue);margin:10px 0">Ур = ('+A+" + "+B+" + "+C+") / 6 × 100% = <b>"+urr+"%</b></div>"+verdict;
}

 }

function bindReport(){

function motVerdict(v){
 if(v>=90)return "очень сильная, максимальная мотивация";
 if(v>=70)return "мотивация сильная";
 if(v>=20)return "средняя мотивация";
 if(v===0)return "мотивация отсутствует";
 return "мотивация ниже средней (диапазон 1–19% в форме не описан); желание заниматься предпринимательством не обосновано";
}
function upkVerdict(v){
 if(v>=90)return "прекрасные предпринимательские качества";
 if(v>=50)return "хорошие предпринимательские качества (возможно, понадобятся помощники)";
 if(v>=25)return "средние качества — деятельность только с партнёрами";
 return "плохие качества — предпринимательская деятельность невозможна";
}
function kosRole(urk,uro){
 if(uro===null||uro===undefined)return "Урк = "+urk+"% (интерпретируется совместно с Уро)";
 if(urk>70&&uro<50)return "роль переговорщика (Урк>70%, Уро<50%)";
 return "см. правила теста 2.2";
}
function kosRole2(uro,urk){
 if(urk===null||urk===undefined)return "Уро = "+uro+"% (интерпретируется совместно с Урк)";
 if(uro>=90&&urk>=90)return "талант руководителя";
 if(uro>=70&&uro<=89&&urk>=70&&urk<=89)return "преуспевающий руководитель";
 if(uro>=50&&uro<=69&&urk>=50&&urk<=69)return "трудно работать руководителем";
 if(uro<49&&urk<49)return "руководство противопоказано";
 if(uro>70&&urk<50)return "роль организационного планирования";
 return "см. правила теста 2.2";
}
